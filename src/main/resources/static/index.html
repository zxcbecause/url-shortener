<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URL Shortener</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 16px; color: #222; }
        h1 { font-size: 1.6rem; }
        form { display: flex; flex-direction: column; gap: 10px; }
        input, button { padding: 10px; font-size: 1rem; border-radius: 6px; border: 1px solid #ccc; }
        button { background: #2563eb; color: #fff; border: none; cursor: pointer; }
        .row { display: flex; gap: 10px; }
        .row input { flex: 1; min-width: 0; }
        #result { margin-top: 20px; padding: 12px; border-radius: 6px; background: #f3f4f6; display: none; word-break: break-all; }
        .error { color: #b91c1c; }
    </style>
</head>
<body>
<h1>URL Shortener</h1>
<form id="form">
    <input id="url" type="url" placeholder="https://example.com/a/very/long/link" required>
    <div class="row">
        <input id="alias" placeholder="custom alias (optional)">
        <input id="ttl" type="number" min="1" placeholder="expires in days (optional)">
    </div>
    <button type="submit">Shorten</button>
</form>
<div id="result"></div>

<script>
    const form = document.getElementById('form');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = { url: document.getElementById('url').value };
        const alias = document.getElementById('alias').value.trim();
        const ttl = document.getElementById('ttl').value;
        if (alias) body.alias = alias;
        if (ttl) body.ttlDays = Number(ttl);

        const res = await fetch('/api/links', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        result.style.display = 'block';
        result.replaceChildren();
        if (res.ok) {
            const a = document.createElement('a');
            a.href = data.shortUrl;
            a.textContent = data.shortUrl;
            a.target = '_blank';
            result.append('Your link: ', a);
        } else {
            const msg = data.errors ? Object.values(data.errors).join(', ') : data.detail;
            const span = document.createElement('span');
            span.className = 'error';
            span.textContent = msg;
            result.append(span);
        }
    });
</script>
</body>
</html>
