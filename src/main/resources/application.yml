spring:
  application:
    name: url-shortener
  datasource:
    url: ${DB_URL:jdbc:h2:mem:links;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

shortener:
  base-url: ${BASE_URL:http://localhost:8080}
  code-length: 7
